<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShaxSocial - Magic Edition 🚀</title>
    <!-- FontAwesome ikonkalar uchun -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            min-height: 100vh;
            padding: 20px 10px;
            max-width: 650px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        header h1 {
            font-size: 2.2rem;
            background: linear-gradient(45deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus {
            border-color: #818cf8;
            box-shadow: 0 0 10px rgba(129, 140, 248, 0.3);
        }

        button.btn-primary {
            width: 100%;
            background: linear-gradient(45deg, #6366f1, #a855f7);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button.btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(168, 85, 247, 0.4);
        }

        .post {
            background: rgba(51, 65, 85, 0.5);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .user-info { display: flex; align-items: center; gap: 10px; }
        .avatar {
            width: 38px; height: 38px;
            background: linear-gradient(45deg, #38bdf8, #818cf8);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #fff;
        }

        .username { font-weight: bold; color: #38bdf8; }
        .time { font-size: 11px; color: #94a3b8; }

        .post-content { margin-bottom: 12px; line-height: 1.5; color: #f1f5f9; }

        .post-actions {
            display: flex;
            gap: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 10px;
            margin-top: 10px;
        }

        .action-btn {
            background: none; border: none; color: #94a3b8;
            cursor: pointer; font-size: 14px; display: flex;
            align-items: center; gap: 5px; transition: 0.2s;
        }

        .action-btn:hover, .action-btn.active { color: #f43f5e; }

        /* Comments section */
        .comments-container {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
        }

        .comment {
            background: rgba(15, 23, 42, 0.4);
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 6px;
            font-size: 13px;
        }

        .comment-user { color: #c084fc; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>ShaxSocial 🚀</h1>
        <p style="font-size: 12px; color: #94a3b8;">Sehrli va Real-vaqtli Ijtimoiy Tarmoq</p>
    </header>

    <div class="card">
        <input type="text" id="username" placeholder="Ismingizni kiriting...">
        <textarea id="postContent" placeholder="Bugun qanday sehrli xabar qoldirasiz?"></textarea>
        <button class="btn-primary" onclick="createPost()"><i class="fa-solid fa-paper-plane"></i> Post qilish</button>
    </div>

    <div id="posts-container">
        <div style="text-align: center; color: #94a3b8;"><i class="fa-solid fa-spinner fa-spin"></i> Postlar yuklanmoqda...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyCAD5g8nwISSbcqpqgyf-...",
          authDomain: "shaxsocial-9061e.firebaseapp.com",
          projectId: "shaxsocial-9061e",
          storageBucket: "shaxsocial-9061e.firebasestorage.app",
          messagingSenderId: "542381407520",
          appId: "1:542381407520:web:e04eb8eeb536aa96b22d61"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Post yaratish
        window.createPost = function() {
            const username = document.getElementById('username').value.trim();
            const content = document.getElementById('postContent').value.trim();

            if(!username || !content) {
                alert("Iltimos, ism va matnni to'liq kiriting!");
                return;
            }

            const postsRef = ref(db, 'posts');
            push(postsRef, {
                username: username,
                content: content,
                likes: 0,
                timestamp: Date.now()
            });

            document.getElementById('postContent').value = '';
        };

        // Layk bosish
        window.likePost = function(id, currentLikes) {
            const postRef = ref(db, `posts/${id}`);
            update(postRef, { likes: (currentLikes || 0) + 1 });
        };

        // Izoh qo'shish
        window.addComment = function(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const username = document.getElementById('username').value.trim() || 'Mehmon';
            const text = input.value.trim();

            if(!text) return;

            const commentsRef = ref(db, `posts/${postId}/comments`);
            push(commentsRef, {
                username: username,
                text: text,
                timestamp: Date.now()
            });

            input.value = '';
        };

        // Postni o'chirish
        window.deletePost = function(postId) {
            if(confirm("Haqiqatan ham ushbu postni o'chirmoqchimisiz?")) {
                remove(ref(db, `posts/${postId}`));
            }
        };

        // Real-vaqt rejimida yuklash
        const postsRef = ref(db, 'posts');
        onValue(postsRef, (snapshot) => {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            const data = snapshot.val();

            if(data) {
                const posts = Object.keys(data).map(key => ({ id: key, ...data[key] })).reverse();

                posts.forEach(post => {
                    const date = new Date(post.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                    const avatarLetter = post.username.charAt(0).toUpperCase();

                    // Comments HTML
                    let commentsHTML = '';
                    if(post.comments) {
                        Object.values(post.comments).forEach(c => {
                            commentsHTML += `
                                <div class="comment">
                                    <span class="comment-user">@${c.username}:</span> ${c.text}
                                </div>
                            `;
                        });
                    }

                    const postDiv = document.createElement('div');
                    postDiv.className = 'post';
                    postDiv.innerHTML = `
                        <div class="post-header">
                            <div class="user-info">
                                <div class="avatar">${avatarLetter}</div>
                                <div>
                                    <div class="username">@${post.username}</div>
                                    <div class="time">${date}</div>
                                </div>
                            </div>
                            <button onclick="deletePost('${post.id}')" style="background:none; border:none; color:#ef4444; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                        </div>
                        <div class="post-content">${post.content}</div>
                        <div class="post-actions">
                            <button class="action-btn" onclick="likePost('${post.id}', ${post.likes || 0})">
                                <i class="fa-solid fa-heart" style="color: #f43f5e;"></i> ${post.likes || 0}
                            </button>
                        </div>
                        <div class="comments-container">
                            ${commentsHTML}
                            <div style="display:flex; gap:5px; margin-top:8px;">
                                <input type="text" id="comment-input-${post.id}" placeholder="Izoh yozing..." style="margin:0; padding:6px 10px; font-size:12px;">
                                <button onclick="addComment('${post.id}')" style="background:#818cf8; border:none; color:white; border-radius:8px; padding:0 12px; cursor:pointer;"><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>
                    `;
                    container.appendChild(postDiv);
                });
            } else {
                container.innerHTML = "<div style='text-align:center; color:#94a3b8;'>Hozircha hech qanday post yo'q. Birinchi sehrli postni siz yozing! ✨</div>";
            }
        });
    </script>
</body>
</html>
