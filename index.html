<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShaxSocial 🚀</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f172a; 
            color: #fff; 
            max-width: 600px; 
            margin: 0 auto; 
            padding: 20px; 
        }
        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: #818cf8;
        }
        .card { 
            background: #1e293b; 
            padding: 20px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }
        .card h3 {
            margin-bottom: 12px;
            font-size: 1.1rem;
            color: #cbd5e1;
        }
        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 12px; 
            background: #334155; 
            border: 1px solid #475569; 
            color: #fff; 
            border-radius: 8px; 
            font-size: 14px;
            outline: none;
        }
        input:focus, textarea:focus {
            border-color: #6366f1;
        }
        textarea {
            resize: vertical;
            min-height: 80px;
        }
        button { 
            width: 100%;
            background: #6366f1; 
            color: white; 
            border: none; 
            padding: 12px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 15px;
            transition: background 0.2s;
        }
        button:hover { 
            background: #4f46e5; 
        }
        .post { 
            background: #334155; 
            padding: 15px; 
            border-radius: 10px; 
            margin-top: 12px; 
            word-wrap: break-word;
        }
        .post strong {
            color: #38bdf8;
            display: block;
            margin-bottom: 6px;
        }
        .post p {
            color: #f1f5f9;
            line-height: 1.4;
        }
        #posts-container {
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>ShaxSocial 🚀</h1>

    <!-- Post yozish oynasi -->
    <div class="card">
        <h3>Yangi post ulashish</h3>
        <input type="text" id="username" placeholder="Foydalanuvchi ismingiz">
        <textarea id="postContent" placeholder="Nimalar haqida o'ylayapsiz?"></textarea>
        <button onclick="createPost()">Postni chop etish</button>
    </div>

    <!-- Postlar lentasi -->
    <div class="card">
        <h3>Postlar lentasi</h3>
        <div id="posts-container">Postlar yuklanmoqda...</div>
    </div>

    <!-- Firebase SDK va Mantiq -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Sizning Firebase sozlamalaringiz
        const firebaseConfig = {
          apiKey: "AIzaSyCAD5g8nwISSbcqpqgyf-...",
          authDomain: "shaxsocial-9061e.firebaseapp.com",
          projectId: "shaxsocial-9061e",
          storageBucket: "shaxsocial-9061e.firebasestorage.app",
          messagingSenderId: "542381407520",
          appId: "1:542381407520:web:e04eb8eeb536aa96b22d61"
        };

        // Firebase ilovasini ulash
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Yangi post yaratish va bazaga yuborish
        window.createPost = function() {
            const username = document.getElementById('username').value.trim();
            const content = document.getElementById('postContent').value.trim();
            
            if(!username || !content) {
                alert("Iltimos, ismingiz va post matnini kiriting!");
                return;
            }

            const postsRef = ref(db, 'posts');
            push(postsRef, {
                username: username,
                content: content,
                timestamp: Date.now()
            });

            document.getElementById('postContent').value = '';
        };

        // Real-vaqt rejimida bazadan postlarni o'qib olish
        const postsRef = ref(db, 'posts');
        onValue(postsRef, (snapshot) => {
            const container = document.getElementById('posts-container');
            container.innerHTML = '';
            const data = snapshot.val();
            
            if(data) {
                const postsArray = Object.keys(data).map(key => ({
                    id: key,
                    ...data[key]
                })).reverse(); // Eng so'nggi postlarni yuqorida ko'rsatish

                postsArray.forEach(post => {
                    const div = document.createElement('div');
                    div.className = 'post';
                    div.innerHTML = `<strong>@${post.username}</strong><p>${post.content}</p>`;
                    container.appendChild(div);
                });
            } else {
                container.innerHTML = "Hozircha hech qanday post yo'q. Birinchi bo'lib yozing!";
            }
        });
    </script>
</body>
</html>
