<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shax Neon Social</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0a0a0f;
      color: #fff;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
    }

    .app-container {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      text-align: center;
      padding: 10px 0;
    }

    .neon-title {
      color: #00f3ff;
      font-size: 28px;
      text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff;
    }

    .neon-title span {
      color: #bc13fe;
      text-shadow: 0 0 10px #bc13fe, 0 0 20px #bc13fe;
    }

    .profile-card, .post-create, .post {
      background: #12121a;
      border: 1px solid #2a2a3d;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 0 15px rgba(188, 19, 254, 0.15);
    }

    .profile-card {
      display: flex;
      align-items: center;
      gap: 15px;
      border-color: #00f3ff;
      box-shadow: 0 0 10px rgba(0, 243, 255, 0.2);
    }

    .avatar {
      font-size: 30px;
      background: #1f1f2e;
      border-radius: 50%;
      padding: 10px;
    }

    .user-info h3 {
      color: #fff;
    }

    .tag {
      color: #8a8a9e;
      font-size: 14px;
    }

    .post-create textarea {
      width: 100%;
      height: 80px;
      background: #0a0a0f;
      border: 1px solid #33334d;
      border-radius: 8px;
      color: #fff;
      padding: 10px;
      resize: none;
      outline: none;
    }

    .post-create textarea:focus {
      border-color: #bc13fe;
      box-shadow: 0 0 8px rgba(188, 19, 254, 0.5);
    }

    .post-create button {
      width: 100%;
      margin-top: 10px;
      padding: 10px;
      background: linear-gradient(45deg, #00f3ff, #bc13fe);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .post-create button:hover {
      opacity: 0.9;
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.6);
    }

    .feed {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .post-author {
      font-weight: bold;
      color: #00f3ff;
    }

    .post-text {
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .post-actions {
      display: flex;
      gap: 15px;
    }

    .action-btn {
      background: transparent;
      border: none;
      color: #8a8a9e;
      cursor: pointer;
      font-size: 14px;
      transition: 0.2s;
    }

    .action-btn:hover, .action-btn.liked {
      color: #bc13fe;
      text-shadow: 0 0 8px #bc13fe;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="header">
      <h1 class="neon-title">SHAX <span>SOCIAL</span></h1>
    </header>

    <section class="profile-card">
      <div class="avatar">👤</div>
      <div class="user-info">
        <h3 id="username">Foydalanuvchi</h3>
        <p class="tag">@shax_user</p>
      </div>
    </section>

    <section class="post-create">
      <textarea id="postInput" placeholder="Nimalar haqida o'ylayapsiz?"></textarea>
      <button id="postBtn" onclick="createPost()">Ulashish 🚀</button>
    </section>

    <section id="feed" class="feed">
      <!-- Postlar shu yerga tushadi -->
    </section>
  </div>

  <script>
    let posts = JSON.parse(localStorage.getItem('shax_posts')) || [];

    function renderPosts() {
      const feed = document.getElementById('feed');
      feed.innerHTML = '';

      posts.forEach((post, index) => {
        const postEl = document.createElement('div');
        postEl.className = 'post';
        postEl.innerHTML = `
          <div class="post-header">
            <span class="post-author">${post.author}</span>
            <span class="tag">${post.time}</span>
          </div>
          <p class="post-text">${post.text}</p>
          <div class="post-actions">
            <button class="action-btn ${post.liked ? 'liked' : ''}" onclick="toggleLike(${index})">
              ❤️ ${post.likes} Like
            </button>
          </div>
        `;
        feed.appendChild(postEl);
      });
    }

    function createPost() {
      const input = document.getElementById('postInput');
      const text = input.value.trim();

      if (!text) return;

      const newPost = {
        author: 'Foydalanuvchi',
        text: text,
        likes: 0,
        liked: false,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      posts.unshift(newPost);
      localStorage.setItem('shax_posts', JSON.stringify(posts));
      input.value = '';
      renderPosts();
    }

    function toggleLike(index) {
      if (posts[index].liked) {
        posts[index].likes--;
        posts[index].liked = false;
      } else {
        posts[index].likes++;
        posts[index].liked = true;
      }
      localStorage.setItem('shax_posts', JSON.stringify(posts));
      renderPosts();
    }

    renderPosts();
  </script>
</body>
</html>
